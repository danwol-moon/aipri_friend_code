name: Validate Cloudflare migration

on:
  push:
    branches: ["cloudflare-full-migration"]
    paths:
      - "app.js"
      - "cloudflare/**"
      - "scripts/migrate-supabase-to-cloudflare.mjs"
      - ".github/workflows/validate-cloudflare.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app.js"
      - "cloudflare/**"
      - "scripts/migrate-supabase-to-cloudflare.mjs"
      - ".github/workflows/validate-cloudflare.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Check Cloudflare Worker module syntax
        run: node --input-type=module --check < cloudflare/worker.js
      - name: Check migration script syntax
        run: node --check scripts/migrate-supabase-to-cloudflare.mjs
